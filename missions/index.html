<!doctype html>
<html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mr. Samir's Missions</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,500;6..12,700;6..12,800;6..12,900&display=swap">
<style>
/* Layout: one-screen home — word-of-the-day slot (swappable for an ad), ENGLISH wordmark, big 9 with books, then a 3×3 grid of pastel illustrated cards. Inner screens use a slim top bar. Light-only by request. */
:root{
  color-scheme:light;
  --paper:#F6F7FB; --card:#FFFFFF;
  --teal:#2F6FD6; --teal-l:#DCE8FB; --teal-d:#1E3A6E;
  --gold:#FFCF3F; --gold-l:#FFF1C7; --gold-d:#C99A10;
  --coral:#F0646C; --coral-l:#FDE2E4;
  --mint:#DDF3E4; --lav:#ECE6FB; --sky:#DDEBFB; --pink:#FCE3E6; --butter:#FFF2CF;
  --ink:#1E3A6E; --muted:#5E6E8A; --line:#E1E5EF;
  --ok:#22A06B; --ok-bg:#DCF5E8; --bad:#E5484D; --bad-bg:#FDE4E2;
  --display:"Fredoka","Baloo 2","Trebuchet MS",sans-serif;
  --body:"Nunito Sans","Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font:500 16px/1.45 var(--body);overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- cover (home) ---------- */
.cover{position:relative;background:var(--paper)}
.cover-in{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-areas:"l m r";gap:16px;align-items:center;padding-block:14px 6px}
.mark{grid-area:m;display:flex;align-items:center;justify-content:center;gap:4px;min-width:0}
.mk{display:grid;justify-items:center;gap:6px;text-align:center;min-width:0}
.mark .eng{margin:0;white-space:nowrap;font-family:var(--display);font-weight:700;font-size:clamp(44px,5vw,64px);line-height:.9;color:var(--teal-d);text-shadow:0 4px 0 #CFDDF5}
.mark .eng span{color:var(--teal)}
.mark .hlt{display:inline-block;font-family:var(--display);font-weight:600;font-size:clamp(15px,2vw,20px);color:var(--ink);padding:4px 14px;background:var(--gold);border-radius:8px;transform:rotate(-2deg);box-shadow:0 3px 0 var(--gold-d);white-space:nowrap}
.mark .by{font-size:13px;font-weight:800;color:var(--muted)}.mark .by b{color:var(--teal-d)}
.ray{flex:none;width:clamp(26px,3vw,40px);height:auto;align-self:flex-start;margin-top:2px}
.ray.l{stroke:var(--teal)}.ray.r{stroke:var(--gold)}
.ray.l path:nth-child(2),.ray.r path:nth-child(2){stroke:var(--gold)}
.ray.r path:nth-child(2){stroke:var(--teal)}
.slot{grid-area:l;position:relative;overflow:hidden;aspect-ratio:320/260;max-width:100%;border-radius:22px;background:var(--card);box-shadow:0 8px 22px rgba(30,58,110,.10);display:flex;flex-direction:column;justify-content:center;gap:4px;padding:14px 16px}
.slot.r{grid-area:r}
.slot.art{padding:0;background:transparent}
.cv-svg{display:block;width:100%;height:100%}
.slot .k{font-size:11.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--coral)}
.slot .sun{position:absolute;right:-26px;bottom:-26px;width:90px;height:90px;border-radius:50%;background:var(--butter)}
.slot>*{position:relative}
.slot.ad h3{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(20px,3vw,28px);line-height:1.05}
.slot.ad p{margin:0;font-weight:700;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.slot.img{padding:0}
.slot.img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.slot.img .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 14px 10px;background:linear-gradient(transparent,rgba(30,58,110,.85));color:#fff}
.slot.img .cap h3{margin:0;color:#fff;font-family:var(--display);font-size:20px}.slot.img .cap p{margin:0;color:#E8EEFA;font-size:13px;font-weight:700}
@media (max-width:760px){
  .cover-in{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"m m" "l r";gap:10px;padding-block:10px 4px}
  .mark .eng{font-size:clamp(46px,14vw,66px)}
  .ray{width:clamp(28px,8vw,44px)}
  .slot{border-radius:18px}
  .slot.ad{padding:10px 12px}.slot.ad p{font-size:12.5px}
}
/* ---------- slim bar (inner pages) ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--teal);color:#fff;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--teal)}
.bar::after{content:"";position:absolute;left:52%;top:-34px;width:56px;height:56px;border-radius:50%;background:var(--gold);opacity:.9}
.bar-in{position:relative;z-index:1;display:flex;align-items:center;gap:10px;padding-block:8px}
.bar .logo{font-family:var(--display);font-weight:900;font-size:24px;letter-spacing:.02em;margin-right:auto}
.bar .logo b{display:inline-grid;place-items:center;min-width:30px;height:30px;margin-left:6px;border-radius:8px;background:var(--gold);color:var(--ink);font-size:22px}
.hbtn{display:inline-flex;align-items:center;gap:6px;border:2px solid rgba(255,255,255,.7);background:rgba(255,255,255,.15);color:#fff;border-radius:99px;padding:5px 12px;font-weight:900;font-size:14px}
.hbtn svg{width:16px;height:16px}

main{padding-block:14px 26px}

/* ---------- menu 3×3 illustrated cards ---------- */
.menu{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.mt{position:relative;border:0;border-radius:20px;background:var(--st);padding:12px 12px 14px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:6px;text-align:center;box-shadow:0 2px 0 rgba(30,58,110,.06),0 8px 18px rgba(30,58,110,.06);transition:transform .15s,box-shadow .15s}
.mt:hover{transform:translateY(-3px);box-shadow:0 2px 0 rgba(30,58,110,.06),0 14px 26px rgba(30,58,110,.12)}
.mt .art{display:grid;place-items:center;flex:1;width:100%}
.mt .art svg{width:clamp(56px,9vw,84px);height:auto}
.mt .nm{font-family:var(--display);font-weight:600;font-size:clamp(15px,2.2vw,21px);line-height:1.1;color:var(--ink);padding-inline:26px}
.mt .go{position:absolute;right:10px;bottom:10px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--ac);color:#fff}
.mt .go svg{width:15px;height:15px}
.mt .soon{position:absolute;left:10px;top:10px;font-size:10px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.8);color:var(--muted);border-radius:99px;padding:2px 7px}
.mt .cnt9{position:absolute;left:10px;top:10px;font-size:11px;font-weight:900;background:var(--coral);color:#fff;border-radius:99px;padding:2px 8px}
@media (max-width:560px){
  .menu{gap:8px}
  .mt{min-height:112px;border-radius:16px;padding:8px 6px 10px}
  .mt .art svg{width:50px}
  .mt .nm{font-size:13.5px;padding-inline:4px}
  .mt .go{display:none}
  .mt .soon{font-size:8.5px;left:6px;top:6px;padding:1px 5px}
}
.chip{display:inline-block;font-size:10.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;border-radius:99px;padding:2px 8px}
.chip.soon{background:var(--gold-l);color:#7A5A00}
.chip.live{background:var(--ok-bg);color:var(--ok)}
.tlink{display:flex;justify-content:center;margin-top:12px}
.tbtn{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--muted);border-radius:99px;padding:6px 12px;font-weight:800;font-size:13px}
.tbtn:hover{color:var(--ink);background:var(--card)}
.tbtn svg{width:16px;height:16px}

/* ---------- headings / misc ---------- */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
h2{font-family:var(--display);font-weight:900;font-size:clamp(28px,5.5vw,38px);line-height:1;margin:0;text-wrap:balance}
h2 small{display:block;font-family:var(--body);font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--teal-d);margin-bottom:5px}
.lead{color:var(--muted);font-weight:700;margin:0;max-width:60ch}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
@media (max-width:640px){.cats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cat{border:2.5px solid var(--line);background:var(--card);border-radius:16px;padding:10px 12px;text-align:left;display:grid;gap:2px}
.cat .cn{font-family:var(--display);font-weight:900;font-size:23px;line-height:1}
.cat .ca{font-size:12.5px;font-weight:800;color:var(--muted)}
.cat .pb{height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.cat .pb i{display:block;height:100%;background:var(--gold)}
.cat[aria-pressed="true"]{border-color:var(--teal);background:#E7F7F5;box-shadow:inset 0 -4px 0 var(--teal)}
.th{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 10px}
.th h3{margin:0;font-family:var(--display);font-weight:800;font-size:23px}
.listbtn{border:2px dashed var(--teal);background:transparent;color:var(--teal-d);border-radius:99px;padding:5px 14px;font-weight:900;font-size:14px}
.tgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}
@media (max-width:520px){.tgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.task{border:0;border-radius:13px;background:var(--card);box-shadow:0 2px 0 var(--line);padding:8px 6px;display:grid;gap:1px;justify-items:center;transition:transform .12s}
.task:hover{transform:translateY(-2px)}
.task .tn{font-family:var(--display);font-weight:900;font-size:26px;line-height:1}
.task .tk{font-size:10.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.task .tb{font-size:11px;font-weight:900;border-radius:99px;padding:1px 7px;background:var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.task.rev{background:#FFF7E3}
.task.done .tb{background:var(--ok-bg);color:var(--ok)}
.task.mid .tb{background:var(--gold-l);color:#835500}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 0;font-size:12.5px;font-weight:800;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:13px;height:13px;border-radius:4px;background:var(--card);box-shadow:0 0 0 2px var(--line)}
.legend i.r{background:#FFF7E3}

/* ---------- quiz ---------- */
.qtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.qtag{font-family:var(--display);font-weight:900;font-size:19px;background:var(--gold);padding:2px 14px 2px 10px;clip-path:polygon(0 0,100% 0,92% 100%,0 100%)}
.prog{flex:1;min-width:110px;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--gold));transition:width .3s}
.cnt{font-weight:900;font-variant-numeric:tabular-nums}
.qcard{position:relative;overflow:hidden;background:var(--card);border-radius:22px;padding:18px 16px 16px;text-align:center;box-shadow:0 2px 0 var(--line),0 12px 26px rgba(34,56,74,.07);margin-bottom:12px}
.qcard::before{content:"";position:absolute;left:-36px;top:-20px;width:50px;height:160%;background:var(--teal-l);transform:rotate(30deg)}
.qcard::after{content:"";position:absolute;right:-24px;bottom:-40px;width:22px;height:160%;background:var(--gold-l);transform:rotate(30deg)}
.qcard>*{position:relative;z-index:1}
.qhint{font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--teal-d)}
.qword{font-family:var(--display);font-weight:900;font-size:clamp(36px,8vw,54px);line-height:1;margin:8px 0 4px;overflow-wrap:anywhere}
.qword.az{font-family:var(--body);font-size:clamp(24px,5.5vw,34px);line-height:1.15}
.qru{font-weight:800;color:var(--muted);font-size:17px}
.qipa{color:var(--muted);font-weight:700;min-height:1.4em}
.spk{width:42px;height:42px;border-radius:50%;border:0;background:var(--coral);color:#fff;display:inline-grid;place-items:center;box-shadow:0 4px 0 #C9474E;vertical-align:middle}
.spk:active{transform:translateY(3px);box-shadow:0 1px 0 #C9474E}
.spk svg{width:20px;height:20px}
.ex{margin:12px auto 0;max-width:560px;text-align:left;background:var(--paper);border-radius:14px;padding:10px 12px;border-left:4px solid var(--teal);animation:rise .3s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.ex .en{font-weight:800;font-size:16px}
.ex .en mark{background:var(--gold-l);color:var(--ink);border-radius:5px;padding:0 3px;font-weight:900;box-shadow:inset 0 -3px 0 var(--gold)}
.ex .az{font-weight:700;color:var(--muted);font-size:14.5px;margin-top:2px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:11px;text-align:left;border:2.5px solid var(--line);background:var(--card);border-radius:15px;padding:10px 12px;font-weight:800;font-size:16.5px;min-width:0;transition:border-color .12s,background .12s}
.opt>span:last-child{min-width:0;overflow-wrap:anywhere}
.opt .ru{display:block;font-size:13.5px;font-weight:700;color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--teal)}
.opt .L{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--teal-l);color:var(--teal-d);font-family:var(--display);font-weight:900;font-size:17px}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}.opt.ok .L{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-bg);animation:shake .35s}.opt.bad .L{background:var(--bad);color:#fff}
@keyframes shake{25%,75%{transform:translateX(-5px)}50%{transform:translateX(5px)}}
.nextbar{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:12px;min-height:50px;font-weight:900;color:var(--ok)}
.auto{width:150px;height:6px;border-radius:99px;background:var(--ok-bg);overflow:hidden}
.auto i{display:block;height:100%;background:var(--ok);animation:fill 1.8s linear forwards}
@keyframes fill{from{width:0}to{width:100%}}
.btn{border:0;border-radius:99px;padding:11px 24px;font-weight:900;font-size:16px}
.btn.p{background:var(--teal);color:#fff;box-shadow:0 4px 0 var(--teal-d)}
.btn.g{background:var(--gold);color:var(--ink);box-shadow:0 4px 0 var(--gold-d)}
.btn.s{background:var(--card);border:2px solid var(--line)}
.res{position:relative;overflow:hidden;background:var(--card);border-radius:24px;padding:24px 16px;text-align:center;box-shadow:0 12px 26px rgba(34,56,74,.07)}
.res::before{content:"";position:absolute;right:-50px;top:-40px;width:100px;height:180%;background:var(--teal-l);transform:rotate(30deg)}
.res>*{position:relative}
.pct{font-family:var(--display);font-weight:900;font-size:clamp(70px,17vw,112px);line-height:.9;color:var(--teal)}
.res h3{font-family:var(--display);font-weight:900;font-size:28px;margin:8px 0 2px}
.res p{margin:0;color:var(--muted);font-weight:800}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.review{margin-top:16px;display:grid;gap:8px}
.review h4{margin:4px 0 0;font-family:var(--display);font-weight:800;font-size:22px}
.rv{display:grid;gap:2px;background:var(--card);border-left:5px solid var(--bad);border-radius:12px;padding:10px 14px}
.rv b{font-size:17px}.rv .t{font-weight:800;color:var(--teal-d)}.rv .y{font-size:13px;color:var(--bad);font-weight:800}

/* ---------- word list ---------- */
.wsearch{width:100%;border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:700;font-size:16px;background:var(--card);margin-bottom:10px}
.wl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:640px){.wl{grid-template-columns:1fr}}
.wi{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:0 10px;align-items:start;background:var(--card);border-radius:12px;padding:9px 10px;box-shadow:0 1px 0 var(--line)}
.wi .n{font-family:var(--display);font-weight:800;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;padding-top:2px}
.wi .w{font-weight:900;font-size:16.5px}
.wi .w i{font-style:normal;font-weight:700;font-size:13px;color:var(--muted);margin-left:6px}
.wi .a{font-size:14px;font-weight:800;color:var(--teal-d)}
.wi .a span{color:var(--muted);font-weight:700}
.wi .e{font-size:13.5px;font-weight:700;color:var(--ink);margin-top:3px}
.wi .e mark{background:var(--gold-l);color:var(--ink);border-radius:4px;padding:0 2px}
.wi .e small{display:block;color:var(--muted);font-size:13px}
.wi .spk{width:36px;height:36px;box-shadow:0 3px 0 #C9474E}
.wi .spk svg{width:17px;height:17px}

/* ---------- soon ---------- */
.soon-box{position:relative;overflow:hidden;background:var(--card);border-radius:22px;padding:20px;box-shadow:0 2px 0 var(--line)}
.soon-box ul{margin:10px 0 0;padding-left:20px;font-weight:700;color:var(--muted)}

/* ---------- teacher ---------- */
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{border:2px solid var(--line);background:var(--card);border-radius:99px;padding:6px 16px;font-weight:900}
.tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.tstatus{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--ink);color:#fff;border-radius:14px;padding:9px 14px;margin-bottom:12px;font-weight:800;font-size:14px}
.tstatus .st{display:inline-flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--teal)}
.dot.wait{background:var(--gold);animation:blink 1s infinite}
.dot.err{background:var(--bad)}
@keyframes blink{50%{opacity:.3}}
.tw{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:0 10px;align-items:center;background:var(--card);border-radius:12px;padding:7px 8px 7px 10px;box-shadow:0 1px 0 var(--line);transition:opacity .18s,transform .18s}
.tw.gone{opacity:0;transform:translateX(30px)}
.tw .n{font-family:var(--display);font-weight:800;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.tw .w{font-weight:900;min-width:0;overflow-wrap:anywhere}
.tw .a{grid-column:2;font-size:13.5px;font-weight:700;color:var(--teal-d);min-width:0}
.del{grid-row:span 2;width:40px;height:40px;border-radius:12px;border:0;background:var(--bad-bg);color:var(--bad);display:grid;place-items:center}
.del:hover{background:var(--bad);color:#fff}
.del svg{width:20px;height:20px}
.removed{margin-top:18px}
.removed h3{font-family:var(--display);font-weight:800;font-size:21px;margin:0 0 8px}
.rchips{display:flex;flex-wrap:wrap;gap:8px}
.rchip{display:inline-flex;align-items:center;gap:6px;border:2px dashed var(--line);background:var(--card);border-radius:99px;padding:3px 5px 3px 12px;font-weight:800;font-size:14px;color:var(--muted)}
.rchip s{text-decoration-thickness:2px}
.rchip button{border:0;background:var(--teal-l);color:var(--teal-d);border-radius:99px;padding:2px 10px;font-weight:900;font-size:12px}
.form{display:grid;gap:12px;background:var(--card);border-radius:18px;padding:16px;box-shadow:0 2px 0 var(--line)}
.form label{display:grid;gap:5px;font-weight:900;font-size:14px}
.form input[type=text],.form textarea{border:2px solid var(--line);border-radius:12px;padding:9px 12px;font-weight:700;background:var(--paper);width:100%}
.form textarea{min-height:76px;resize:vertical}
.frow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.file{display:inline-flex;align-items:center;gap:8px;border:2px dashed var(--teal);border-radius:12px;padding:8px 14px;font-weight:900;color:var(--teal-d);cursor:pointer}
.file input{position:absolute;width:1px;height:1px;opacity:0}

.pcb{border:0;border-radius:99px;padding:3px 9px;font-size:11px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;background:var(--teal-l);color:var(--teal-d)}

.more{display:flex;justify-content:center;margin-top:10px}

}

.lb{position:fixed;inset:0;z-index:50;background:rgba(20,30,50,.85);display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;padding:calc(16px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}

 reading:{title:'Security report — Gate B',p:["At twenty past ten this morning there were a lot of people at the security check near Gate B. Four passengers were standing next to the X-ray machine at the same time. Each passenger put a bag in a grey box, and the boxes went through the machine together.","The first passenger was Mr. Jones, a businessman from Manchester. His bag has a big blue label with his name and phone number on it, so the officer found it and gave it back to him easily. The second passenger was Sara, a student who is travelling to Rome with her school orchestra.","The third passenger was a doctor, Mrs. Kim. She showed her passport to the officer and asked for the way to Gate 5. The last passenger was Leo, a young football player. He was in a hurry, because his team's flight to Madrid was already boarding.","Ten minutes later, a student came to the officer and said that his small black bag with a red ribbon was missing."],

{id:5,t:'The Island Treasure',az:'Adanın xəzinəsi',ic:'🏝️',gate:'code',code:'2749',gateWhat:'sandığın kodunu yazacaqsan',
 story:"Xəzər dənizində kiçik <b>Qağayı adası</b> var. 100 il əvvəl Kapitan Murad gəmisinin qızıl sikkələrini orada köhnə <b>dəmir sandıqda</b> gizlədib. Sandıq <b>4 rəqəmli kodla</b> açılır. Kapitanın gündəliyi və köhnə radio yazısı kodu gizlədir. Rəqəmləri tap və sandığı aç!",

 reading:{title:"The Captain's Diary",p:["My name is Captain Murad. In the summer of 1925, my ship, the Sea Star, sailed from Baku with seven sailors and a box of gold coins. On the third day a terrible storm started. The wind was so strong that we couldn't control the ship.","In the morning we saw a small island with white sand and hundreds of seagulls, so we called it Seagull Island. Our ship was badly damaged, and we stayed on the island for two weeks to repair it. We drank water from a small lake in the middle of the island.","Before we left, I put the gold coins in an iron chest. I buried the chest near the old lighthouse, on the east side of the island. Only my youngest sailor, Elnur, knows the way. I gave him my old compass, so he can always find the place."],
  qs:[{q:"What was the name of the ship?",o:["The Sea Star","Seagull","The Gold Coin","The Storm"],a:0},
      {q:"Why couldn't they control the ship?",o:["The wind was very strong.","The captain was ill.","The sailors were tired.","The ship had no engine."],a:0},
      {q:"How long did they stay on the island?",o:["Two weeks","Two days","Three weeks","One month"],a:0},

  detail:{q:"What did the captain give to Elnur?",o:["His old compass","A gold coin","A map","His diary"],a:0}},
 listening:{who:"Elnur's old radio recording",p:["This is Elnur. I was the youngest sailor on the Sea Star. Now I am very old, so I am recording this message.","If you want to find the chest, start at the small wooden boat on the west shore.","Walk to the lake, and then turn left.","Soon you will see the old lighthouse.","Near the lighthouse there are four big rocks. The chest is under the biggest one.","Be careful! Don't go there in the evening. At six o'clock the sea comes in and the water covers the rocks.","Take a spade and a strong rope, because the chest is very heavy.","Good luck, my young friend."],

{id:6,t:'Space Station Alarm',az:'Kosmik stansiyada həyəcan',ic:'🚀',gate:'word',password:'PEPPER',gateWhat:'gizli parolu yazacaqsan',
 story:"Sən Yer kürəsinin ətrafında uçan <b>Nova-7</b> kosmik stansiyasında gənc astronavtsan. Gecə həyəcan siqnalı səslənir: əsas kompüter sönüb və <b>oksigen sistemi bir saat sonra dayanacaq!</b> Kompüteri yenidən işə salmaq üçün <b>gizli parol</b> lazımdır. Komandir Ray Yerə uçub, amma ipucları qoyub. Parolu tap və stansiyanı xilas et!",

 vocab:[['astronaut','astronavt','Four astronauts live on the station.'],['oxygen','oksigen','We can not live without oxygen.'],['alarm','həyəcan siqnalı','Suddenly the alarm started.'],['commander','komandir','The commander is flying back to Earth.'],['password','parol','The computer will ask for a password.'],['screen','ekran','Sometimes the screen goes black.'],['muscle','əzələ','Our muscles become weak in space.'],['corridor','dəhliz','The control room is at the end of the corridor.']],
 reading:{title:"Commander Ray's log",p:["Day 40. Life on the space station Nova-7 is busy. There are four astronauts here, and we fly around the Earth sixteen times a day. Every morning we exercise for two hours, because our muscles become weak in space.","I miss my family a lot. My son, Daniel, is ten. He has a big brown dog called Max, and they play football in the garden every day. My daughter, Aylin, is seven. She has a small white cat called Pepper. Aylin says that Pepper sleeps on my pillow when I am away.","Tomorrow I am flying back to Earth for an important meeting, so the young astronauts will be alone for three days. I am a little worried about the main computer. It is old, and sometimes the screen goes black. If that happens, the oxygen system can stop after one hour.","I have changed the computer password. I will not write it here, because somebody can read this log."],

 listening:{who:"Commander Ray's recorded message",p:["Hello, team. This is Commander Ray. If you are listening to this, the main computer has stopped.","Don't panic. First, put on your oxygen masks. They are in the blue box next to the kitchen.","Then go to the control room. It's at the end of the long corridor, on the left.","Press the red button under the screen and wait for thirty seconds.","The computer will ask for a password.","The password is the name of my daughter's pet. Write it in capital letters.","Don't use the radio for the next ten minutes, because the computer needs all the power.","I'm sure you can do it. See you in three days."],

{id:7,t:'The Missing Trophy',az:'İtən kubok',ic:'🏆',gate:'choice',gateWhat:'kubokun yerini və onu gizlədəni seçəcəksən',

 reading:{title:'School News: Where is our trophy?',p:["Our school's golden trophy is usually in the glass cabinet in the main hall. We won it three years ago, and tomorrow our football team will play in the city final again. The headmaster wants to give the trophy to the players before the match.","This morning the cleaner, Nigar, dusted the cabinet at half past seven, and the trophy was there. At a quarter past eight the headmaster walked past and saw that the cabinet was empty. The glass wasn't broken, so somebody opened it with a key.","There are only two keys. One belongs to the PE teacher, Mr. Hasanov, but he was at a meeting in another school all morning. The other key belongs to the team captain, Murad, because he comes early to train with the team. The players always train in their red shirts.","If you have any information, please speak to the headmaster."],

  :msShufQ({k:'İngiliscəsini seç',q:`<span class="mq-big az">${msE(L[2])}</span>${pos}`,o:[L[0],...mqDistr(L,0,T)].map(msE),a:0,ex,src:[L,dir]})}

  msBindBack(()=>mqTask(T.id));return}
 let heard=false,plays=0,useTTS=!T.audio,playing=false;
 app.innerHTML=mqHead(T,2)+`<div class="ms-brief"><b>Tapşırıq:</b> Əvvəlcə sualları oxu, sonra səsi dinlə. Səsi <b>istədiyin qədər</b> dinləyə bilərsən. Testə başlamaq üçün səsi ən azı bir dəfə sonuna qədər dinlə. Test zamanı səs bağlanır. Növbəti mərhələyə keçmək üçün <b>bütün suallara</b> düz cavab verməlisən.</div>
 <div class="mq-qlist"><b>Dinləyərkən bu sualların cavabını axtar:</b><ol>${L.qs.map(q=>`<li class="${wrong&&wrong.includes(q.q)?'mq-wr':''}">${msE(q.q)}</li>`).join('')}</ol>${wrong?'<p class="mq-wrn">Qırmızı sualların cavabını əvvəlki dəfə tapmamışdın — onlara xüsusi diqqət et.</p>':''}</div>
 <div class="ms-radio" id="msrd"><span style="font-size:11px;font-weight:900;letter-spacing:.14em;color:var(--gold)">AUDIO · ${msE(L.who)}</span>
  <div class="wave">${'<i></i>'.repeat(14)}</div><div class="prog" style="width:min(320px,100%);flex:none"><i id="msrp" style="width:0%"></i></div><span class="lp" id="mqtime">&nbsp;</span>
  <button class="btn g" type="button" id="msplay">▶ Dinlə</button><span class="lp" id="msleft">Dinləmə sayı: 0</span></div>
 <div class="btns"><button class="btn p" type="button" id="mqtest" disabled>Testə başla</button></div><p class="ms-wc" id="mqtw" style="text-align:center">Testə başlamaq üçün səsi sonuna qədər dinlə.</p>`;

 const ui=()=>{if(!pb.isConnected)return;pb.textContent=playing?'⏸ Dayandır':plays||heard?'▶ Yenidən dinlə':'▶ Dinlə';rd.classList.toggle('on',playing);

 const ended=()=>{playing=false;plays++;heard=true;pr.style.width='100%';ui()};
 let au=null;

  app.innerHTML=mqHead(T,2)+`<div class="ms-brief" style="border-left-color:var(--coral)">Səs bağlıdır. Cəhd: <b>${att}</b></div><div class="ms-panel" id="msbox"></div>`;

   msTop();app.innerHTML=mqHead(T,2)+`<div class="ms-panel ms-res"><span class="chip soon">Yenə dinlə</span><div class="big" style="color:var(--bad)">${wr.length} / ${n}</div>

/* ---------- stage 4: sentence building ---------- */
function mqBuild(T){let k=0,err=0;msTop();
 app.innerHTML=mqHead(T,3)+`<div class="ms-brief"><b>Tapşırıq:</b> Cümlələrin sözləri qarışıb. Azərbaycanca mənasına bax və sözləri düzgün ardıcıllıqla düz. <b>Diqqət:</b> bu cümlələrdə məqsədə aparan vacib məlumatlar var — onları yadda saxla, final qapısında soruşulacaq!</div><div class="ms-panel" id="msbox"></div>`;
 msBindBack(()=>mqTask(T.id));const box=document.getElementById('msbox');
 const step=()=>{const W=T.build[k][0].split(' '),pool=shuffle(W.map((_,i)=>i)),pick=[];
  const draw=()=>{box.innerHTML=`<div class="ms-qh"><span>Cümlə ${k+1}/${T.build.length}</span><div class="prog"><i style="width:${k/T.build.length*100}%"></i></div></div>
   <p style="font-weight:800;margin:0 0 8px">🇦🇿 ${msE(T.build[k][1])}</p>
   <div class="ms-slot">${pick.map((i,j)=>`<button class="ms-chip on" type="button" data-p="${j}">${msE(W[i])}</button>`).join('')||'<span class="ms-wc">Sözlərə toxun…</span>'}</div>
   <div class="ms-chips">${pool.filter(i=>!pick.includes(i)).map(i=>`<button class="ms-chip" type="button" data-i="${i}">${msE(W[i])}</button>`).join('')}</div><div class="ms-fb" id="msfb"></div>`;
   box.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{pick.push(+b.dataset.i);draw()});
   box.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{pick.splice(+b.dataset.p,1);draw()});
   if(pick.length===W.length){const fb=document.getElementById('msfb');fb.innerHTML='<button class="btn p" type="button" id="msck">Yoxla</button>';
    document.getElementById('msck').onclick=()=>{
     if(pick.map(i=>W[i]).join(' ')!==W.join(' ')){err++;fb.innerHTML='<div class="ms-ex b">✗ Ardıcıllıq səhvdir. Xatırla: mübtəda → xəbər → tamamlıq → yer/vaxt.</div><button class="btn s" type="button" id="msclr">Yenidən düz</button>';document.getElementById('msclr').onclick=()=>{pick.length=0;draw()};return}
     fb.innerHTML=`<div class="ms-ex g">✓ ${msE(W.join(' '))}.<div class="mq-exs">🧠 Yadda saxla: ${msE(T.build[k][1])}</div></div>`;
     const tok=MS_TOK;setTimeout(()=>{if(tok!==MS_TOK||!fb.isConnected)return;k++;k<T.build.length?step():mqStageDone(T,'build',Math.max(60,100-err*10),`Səhv cəhdlər: ${err}`)},2600)}}};
  draw()};
 step();
}

function mqGate(T,ok){msTop();let tries=0;
 const win=()=>{const S=mqT(T.id),first=!S.done;S.s.final=Math.round(ok*10);S.done=1;mqSave();msTop();const st=mqStars();
  app.innerHTML=`<div class="ms-dos"><span class="k">Mission complete</span><h2>${T.ic} ${msE(T.t)}</h2><p style="margin:0;color:#E2EAF8;font-weight:700;line-height:1.55">${msE(T.end)}</p></div>
  <div class="ms-panel ms-res"><div style="font-size:64px;line-height:1">⭐</div><h3>${first?'+1 ulduz qazandın!':'Bu taskı artıq bitirmisən'}</h3><p class="lead" style="margin:6px auto 0">Level 1: <b>${st} / ${MQ_LEVEL}</b> ulduz${st>=MQ_LEVEL?' — Level 2 açıldı!':''}</p>
  <div class="btns"><button class="btn p" type="button" id="mqh">Level 1-ə qayıt</button></div></div>`;
  document.getElementById('mqh').onclick=msHub};
 const fail=(box,msg)=>{tries++;box.innerHTML=`<div class="ms-ex b">✗ ${msg}</div>${tries>=2?`<p class="ms-wc" style="text-align:center">${T.hint}</p>`:''}`};
 let html=mqHead(T,5)+`<div class="ms-panel ms-res"><span class="chip live">${T.final.length} sualdan ${ok}-i düz</span><h3 style="margin-top:8px">${msE(T.gateQ)}</h3>`;
 if(T.gate==='code'){
  app.innerHTML=html+`<div class="ms-code" style="margin:12px 0"><input id="c1" inputmode="numeric" maxlength="1" aria-label="1-ci rəqəm"><input id="c2" inputmode="numeric" maxlength="1" aria-label="2-ci rəqəm"><input id="c3" inputmode="numeric" maxlength="1" aria-label="3-cü rəqəm"><input id="c4" inputmode="numeric" maxlength="1" aria-label="4-cü rəqəm"></div>
  <div class="btns" style="margin-top:0"><button class="btn g" type="button" id="mqok">🔓 Qapını aç</button></div><div id="mqfb" style="margin-top:10px"></div></div>${mqNotebook(T)}`;
  const ids=['c1','c2','c3','c4'];ids.forEach((id,k)=>{const el=document.getElementById(id);el.oninput=()=>{el.value=el.value.replace(/\D/g,'');if(el.value&&ids[k+1])document.getElementById(ids[k+1]).focus()}});
  document.getElementById('mqok').onclick=()=>{const v=ids.map(x=>document.getElementById(x).value).join('');v===T.code?win():fail(document.getElementById('mqfb'),'Kod yanlışdır. Qapı açılmadı.')};
 }else if(T.gate==='culprit'){let pick='';
  const S=mqT(T.id),out=T.suspects.filter(x=>x[3]&&S.s[x[3]]).map(x=>x[0]);
  app.innerHTML=html+`<div class="mq-sus" style="margin-top:12px">${T.suspects.slice().sort((x,y)=>x[0].localeCompare(y[0])).map(s=>`<button type="button" data-n="${msE(s[0])}" class="${out.includes(s[0])?'out':''}"><span class="e">${s[2]}</span>${msE(s[0])}<small>${msE(s[1])}</small></button>`).join('')}</div>
  <div id="mqev"></div><div id="mqfb" style="margin-top:10px"></div></div>${mqNotebook(T)}`;
  const ev=document.getElementById('mqev');
  app.querySelectorAll('.mq-sus button').forEach(b=>b.onclick=()=>{pick=b.dataset.n;app.querySelectorAll('.mq-sus button').forEach(x=>x.classList.toggle('on',x===b));
   if(pick!==T.answer){fail(document.getElementById('mqfb'),'Bu şəxs deyil — onun alibisi var. Dəftərinə bax və başqasını seç.');ev.innerHTML='';return}
   document.getElementById('mqfb').innerHTML='';const q=msShufQ(T.evQ);
   ev.innerHTML=`<p style="font-weight:900;margin:6px 0 8px">${msE(q.q)}</p><div class="opts">${q.o.map((o,j)=>`<button class="opt" type="button" data-j="${j}"><span class="L">${'ABCD'[j]}</span><span>${msE(o)}</span></button>`).join('')}</div>`;
   ev.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{+o.dataset.j===q.a?(o.classList.add('ok'),setTimeout(win,MQ_AUTO)):(o.classList.add('bad'),o.disabled=true,fail(document.getElementById('mqfb'),'Bu sübut deyil. Dəftərinə və eşitdiklərinə bir də fikir ver.'))})});
 }else if(T.gate==='word'){
  app.innerHTML=html+`<input class="ms-in" id="mqpw" maxlength="20" autocomplete="off" spellcheck="false" style="margin:12px auto;max-width:320px;text-align:center;text-transform:uppercase;letter-spacing:.2em;font-size:24px;font-family:var(--display)" placeholder="······">
  <div class="btns" style="margin-top:0"><button class="btn g" type="button" id="mqok">🔓 Daxil et</button></div><div id="mqfb" style="margin-top:10px"></div></div>${mqNotebook(T)}`;
  const inp=document.getElementById('mqpw');
  const chk=()=>{const v=inp.value.trim().toUpperCase().replace(/\s+/g,'');if(!v)return;if(v===T.password){win();return}
   fail(document.getElementById('mqfb'),(T.wrong&&T.wrong[v])||'Parol yanlışdır. Kompüter qəbul etmədi.')};
  document.getElementById('mqok').onclick=chk;inp.onkeydown=e=>{if(e.key==='Enter')chk()};
 }else{const C=T.choice,val={a:'',b:''};
  app.innerHTML=html+['a','b'].map(g=>`<p style="font-weight:900;margin:12px 0 6px;text-align:left">${C[g].lab}</p><div class="ms-dirs" id="mq_${g}">${shuffle(C[g].opts).map(p=>`<button class="ms-dir" type="button" data-v="${msE(p)}">${msE(p)}</button>`).join('')}</div>`).join('')+`
  <div class="btns"><button class="btn g" type="button" id="mqok">Yoxla</button></div><div id="mqfb" style="margin-top:10px"></div></div>${mqNotebook(T)}`;
  ['a','b'].forEach(g=>app.querySelectorAll('#mq_'+g+' .ms-dir').forEach(b=>b.onclick=()=>{val[g]=b.dataset.v;app.querySelectorAll('#mq_'+g+' .ms-dir').forEach(x=>x.classList.toggle('on',x===b))}));
  document.getElementById('mqok').onclick=()=>{const fb=document.getElementById('mqfb');if(!val.a||!val.b){fb.innerHTML='<div class="ms-ex b">Hər iki sualı cavablandır.</div>';return}
   const A=val.a===C.a.ans,B=val.b===C.b.ans;
   if(A&&B)win();else fail(fb,!A&&!B?'İkisi də səhvdir.':!A?`${C.b.lab.replace(/^\S+\s/,'')} — düzdür, amma birinci cavab səhvdir.`:`${C.a.lab.replace(/^\S+\s/,'')} — düzdür, amma ikinci cavab səhvdir.`)};
 }
 msBindBack(()=>mqTask(T.id));
}

/* ---------- Learn Vocabulary ---------- */
function mqLearn(T,mode,idx){mode=mode||'list';idx=idx||0;msTop();const W=T.learn;
 const tabs=`<div class="ms-tabs"><button class="tab" type="button" data-m="list" aria-pressed="${mode==='list'}">📋 Siyahı</button><button class="tab" type="button" data-m="card" aria-pressed="${mode==='card'}">🃏 Kartlar</button></div>`;
 const head=msBackBtn('Task '+T.id)+`<div class="head"><h2><small>Task ${T.id} · ${msE(T.az)}</small>📚 Learn Vocabulary</h2><p class="lead">Bu missiyada qarşına çıxacaq ən vacib ${W.length} A2 sözü. İstəsən əvvəlcədən öyrən.</p></div>`+tabs;
 if(mode==='list'){
  app.innerHTML=head+`<div class="mq-lw">${W.map((w,i)=>`<div class="r"><button class="spk" type="button" data-w="${msE(w[0])}" aria-label="Dinlə">${ICON_SPK}</button><div style="min-width:0"><div><b>${msE(w[0])}</b> <span class="mq-pos">${MQ_POS[w[1]]||''}</span> <span class="az">— ${msE(w[2])}</span></div><div class="ex">${mqHi(w[3],w[0])}</div></div></div>`).join('')}</div>`;
 }else{const w=W[idx];
  app.innerHTML=head+`<div class="mq-fc" id="mqfc" role="button" tabindex="0" aria-label="Kartı çevir"><div class="in"><div class="f"><span class="mq-big">${msE(w[0])}</span><span class="mq-pos">${MQ_POS[w[1]]||''}</span><small>Tərcüməni görmək üçün toxun</small></div><div class="b"><span class="mq-big az">${msE(w[2])}</span><p>${mqHi(w[3],w[0])}</p></div></div></div>
  <div class="mq-fcn"><button class="btn s" type="button" id="mqpv" ${idx?'':'disabled'}>‹ Əvvəlki</button><span>${idx+1} / ${W.length}</span><button class="spk" type="button" id="mqsp" aria-label="Dinlə">${ICON_SPK}</button><button class="btn p" type="button" id="mqnx2" ${idx<W.length-1?'':'disabled'}>Növbəti ›</button></div>`;
  const fc=document.getElementById('mqfc');const flip=()=>fc.classList.toggle('fl');fc.onclick=flip;fc.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};
  document.getElementById('mqsp').onclick=()=>say(w[0]);
  document.getElementById('mqpv').onclick=()=>mqLearn(T,'card',idx-1);document.getElementById('mqnx2').onclick=()=>mqLearn(T,'card',idx+1);
 }
 msBindBack(()=>mqTask(T.id));
 app.querySelectorAll('.ms-tabs .tab').forEach(b=>b.onclick=()=>mqLearn(T,b.dataset.m,0));
 app.querySelectorAll('.mq-lw .spk').forEach(b=>b.onclick=()=>say(b.dataset.w));
}


const MQ_AUD={"1": "audio/task1.mp3", "2": "audio/task2.mp3", "3": "audio/task3.mp3", "4": "audio/task4.mp3", "5": "audio/task5.mp3", "6": "audio/task6.mp3", "7": "audio/task7.mp3"};
MQ_TASKS.forEach(T=>{if(MQ_AUD[T.id])T.audio=MQ_AUD[T.id]});
msHub();

</script>
