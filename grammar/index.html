<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grammar · My New Vocabulary</title>
<meta name="theme-color" content="#1F3C88">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
<style>
:root{
  --bg:#EDF1F7; --surface:#FFFFFF; --ink:#14213D; --muted:#5A6684; --line:#D3DAE6;
  --brand:#1F3C88; --brand-ink:#FFFFFF; --mark:#FFE27A; --mark-ink:#14213D;
  --ok:#15803D; --ok-bg:#DCF5E3; --bad:#C62828; --bad-bg:#FBE1E1;
  --blue:#2563EB; --blue-bg:#DCE8FF; --warn:#D9700A; --warn-bg:#FFEAD3;
  --serif: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1424; --surface:#172038; --ink:#E7ECF6; --muted:#9AA6C1; --line:#2B385A;
    --brand:#7C9BFF; --brand-ink:#0D1424; --mark:#5C4C0C; --mark-ink:#FFF3C4;
    --ok:#4ADE80; --ok-bg:#11331E; --bad:#FF7B7B; --bad-bg:#3C1616;
    --blue:#7DA8FF; --blue-bg:#172B52; --warn:#FFA94D; --warn-bg:#3B250F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
    --bg:#0D1424; --surface:#172038; --ink:#E7ECF6; --muted:#9AA6C1; --line:#2B385A;
    --brand:#7C9BFF; --brand-ink:#0D1424; --mark:#5C4C0C; --mark-ink:#FFF3C4;
    --ok:#4ADE80; --ok-bg:#11331E; --bad:#FF7B7B; --bad-bg:#3C1616;
    --blue:#7DA8FF; --blue-bg:#172B52; --warn:#FFA94D; --warn-bg:#3B250F;
    color-scheme: dark;
  }
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px}
.screen[hidden]{display:none}
h1{font-family:var(--serif);font-size:30px;line-height:1.15;margin:8px 0 4px;font-weight:700}
h2{font-size:20px;margin:0 0 10px}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:14px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px 18px;font-weight:650;background:var(--brand);color:var(--brand-ink);font-size:17px}
.btn:disabled{opacity:.55}
.btn.ghost{background:transparent;color:var(--brand);border:2px solid var(--line)}
.btn.wa{background:#1FA855;color:#fff}
.btn + .btn{margin-top:10px}
.link{background:none;border:0;color:var(--brand);text-decoration:underline;padding:6px 0;font-size:15px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}

/* Qeydiyyat */
.hero{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#1F3C88;color:#fff;border-radius:22px;padding:22px 18px;margin-bottom:16px;min-height:150px}
.hero::before{content:"";position:absolute;right:-70px;top:-80px;width:230px;height:230px;border-radius:50%;background:#2B4FA8}
.hero-txt{position:relative;min-width:0}
.chip{display:inline-block;background:#FFE27A;color:#14213D;font-weight:700;font-size:13px;border-radius:7px;padding:2px 9px}
.hero-t{font-family:var(--serif);font-size:clamp(28px,8.5vw,40px);font-weight:700;line-height:1.05;margin:10px 0 6px}
.hero-s{font-size:14px;opacity:.9}
.hero-card{position:relative;flex:none;width:118px;background:#fff;color:#14213D;border-radius:14px;padding:10px 9px;box-shadow:0 10px 24px rgba(0,0,0,.25);transform:rotate(3deg)}
.hero-card b{display:block;text-align:center;font-family:var(--serif);font-size:17px;margin-bottom:6px}
.hero-card i{display:block;font-style:normal;font-size:11.5px;border:2px solid #D3DAE6;border-radius:8px;padding:4px 7px;margin-top:5px}
.hero-card i.ok{border-color:#15803D;background:#DCF5E3}
@media (max-width:340px){.hero-card{display:none}}
.dirseg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 16px}
.dirseg button{padding:12px 8px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:650;font-size:15px;line-height:1.25}
.dirseg button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}
.tile.r .ic{background:var(--ok-bg)} .tile.m .ic{background:var(--bad-bg)}
.rtext{font-family:var(--serif);font-size:19px;line-height:1.65}
.rtext p{margin:0 0 14px}
.rw{font:inherit;color:inherit;background:var(--mark);color:var(--mark-ink);border:0;border-radius:5px;padding:0 3px;cursor:pointer}
.rw.on{outline:2px solid var(--brand)}
.lvl{display:inline-block;background:var(--ok-bg);color:var(--ok);font-weight:700;font-size:13px;border-radius:7px;padding:2px 8px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);border-radius:20px 20px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.18);padding:16px 20px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet[hidden]{display:none}
.sheet .en{font-family:var(--serif);font-size:26px;font-weight:700}
.sheet .az{font-size:20px;margin:2px 0 10px}
.sheet .row2{display:flex;gap:10px;align-items:center}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.mrow b{display:block} .mrow small{color:var(--muted)}
.mrow .cnt{color:var(--bad);font-weight:700;font-size:14px;white-space:nowrap}
.gitems{margin:8px 0 4px;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:17px}
.gitems li{padding:2px 0} .gitems li b{color:var(--muted);margin-right:6px}
.qtext i{font-style:italic} .qtext u{text-decoration:underline;text-underline-offset:3px}
.tile .az2{display:block;font-size:13px;color:var(--muted)}
.wrong.g li{display:block}
.wrong.g li span:last-child{display:block;text-align:left;color:var(--ok);font-weight:600;margin-top:3px}
.field{margin-bottom:14px}
.field label{display:block;font-weight:650;margin-bottom:6px}
.field input,.field select{width:100%;padding:13px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:17px}
.field input:focus{border-color:var(--brand);outline:none}
.hint{font-size:14px;color:var(--muted);margin-top:5px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{padding:13px 6px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:650;font-size:16px}
.seg button[aria-checked="true"]{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}
.phone{display:flex;align-items:stretch;border:2px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.phone:focus-within{border-color:var(--brand)}
.phone span{padding:13px 12px;background:var(--bg);font-weight:650;border-right:2px solid var(--line)}
.phone input{border:0!important;border-radius:0;flex:1;min-width:0}
.phone-label{background:var(--mark);color:var(--mark-ink);padding:1px 6px;border-radius:5px}
.err{color:var(--bad);font-size:15px;margin:4px 0 12px;min-height:1px}
.brandline{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:15px}
.badge{display:inline-block;background:var(--brand);color:var(--brand-ink);font-weight:700;border-radius:8px;padding:2px 9px;font-size:14px}

/* Ana ekran */
.tiles{display:grid;gap:14px;margin-top:18px}
.tile{display:flex;align-items:center;gap:16px;text-align:left;width:100%;border:2px solid var(--line);background:var(--surface);border-radius:20px;padding:20px}
.tile .ic{flex:none;width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:30px;background:var(--blue-bg)}
#pick-list .ic{font-family:var(--serif);font-weight:700;font-size:26px;color:var(--brand)}
.tile.g .ic{background:var(--warn-bg)}
.tile.done{border-color:var(--blue);background:var(--blue-bg)}
.tile.done .ic{background:var(--blue);color:#fff}
.tile:disabled{opacity:.55;cursor:default}
.tile .st2{display:block;font-size:14px;font-weight:650;margin-top:2px}
.tile .st2.ok{color:var(--blue)} .tile .st2.no{color:var(--warn)}
.tile b{display:block;font-size:21px}
.tile small{color:var(--muted);font-size:15px}

/* Vocabulary */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.progress{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-bottom:22px}
.progress i{display:block;height:100%;background:var(--brand);transition:width .25s}
.wordbox{text-align:center;padding:26px 12px 22px}
.word{font-family:var(--serif);font-size:clamp(34px,10vw,50px);font-weight:700;line-height:1.1;word-break:break-word}
.speak{margin-top:14px;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 18px;font-weight:650;color:var(--brand)}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{width:100%;text-align:left;padding:15px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:18px;font-weight:550;display:flex;gap:12px;align-items:center}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--bg);font-size:14px;font-weight:700;color:var(--muted)}
.opt.is-ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.is-ok .k{background:var(--ok);color:#fff}
.opt.is-bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.is-bad .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default;color:inherit;opacity:1}
.feedback{margin-top:16px;border-left:5px solid var(--bad);background:var(--surface);border-radius:12px;padding:14px 16px}
.feedback .ex{font-family:var(--serif);font-size:19px;margin:6px 0 0}
mark{background:var(--mark);color:var(--mark-ink);padding:0 3px;border-radius:4px}

/* Grammar */
.nav{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.nav button{width:40px;height:40px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:15px}
.nav .n-ok{background:var(--blue);border-color:var(--blue);color:#fff}
.nav .n-bad{background:var(--bad);border-color:var(--bad);color:#fff}
.nav .n-skip{background:var(--warn);border-color:var(--warn);color:#fff}
.nav .n-cur{box-shadow:0 0 0 3px var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted);margin:-6px 0 14px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.qtext{font-size:20px;font-weight:600;margin:4px 0 6px}
.pager{display:flex;gap:10px;margin-top:18px}
.pager .btn{margin:0}

/* Nəticə */
.score{font-family:var(--serif);font-size:64px;font-weight:700;line-height:1;margin:6px 0}
.score small{font-size:26px;color:var(--muted)}
.wrong{list-style:none;padding:0;margin:8px 0 0}
.wrong li{padding:9px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
.wrong li span:last-child{color:var(--muted);text-align:right}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 18px;margin-top:6px}
.rhead{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted);font-weight:600}
.rwho{font-family:var(--serif);font-size:26px;font-weight:700;margin-top:12px;line-height:1.2}
.rsub{color:var(--muted);margin-top:2px}
.rscore{display:flex;align-items:baseline;justify-content:space-between;margin:16px 0 8px}
#res-score{font-family:var(--serif);font-size:58px;font-weight:700;line-height:1}
#res-score small{font-size:26px;color:var(--muted)}
#res-pct{font-size:24px;font-weight:700;color:var(--brand)}
.rbar{height:10px;background:var(--line);border-radius:10px;overflow:hidden;margin-bottom:16px}
.rbar i{display:block;height:100%;background:var(--brand)}
.sendstate{font-size:15px;margin-top:10px}
.sendstate.ok{color:var(--ok)} .sendstate.bad{color:var(--bad)}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(5,10,25,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px;z-index:20}
.modal[hidden]{display:none}
.modal .card{max-width:520px;width:100%;margin-bottom:env(safe-area-inset-bottom,0px)}

/* Müəllim paneli */
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;margin:14px 0}
.tabs button{flex:1;border:0;background:transparent;border-radius:10px;padding:10px;font-weight:650}
.tabs button[aria-selected="true"]{background:var(--brand);color:var(--brand-ink)}
.filters{display:flex;gap:8px;margin-bottom:12px}
.filters input,.filters select{flex:1;min-width:0;padding:11px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface)}
.stats{display:flex;gap:10px;margin-top:10px}
.stats div{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stats b{display:block;font-size:24px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:9px}
.row .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.row .name{font-weight:700}
.row .meta{font-size:14px;color:var(--muted)}
.row a{color:var(--brand)}
.st{font-size:13px;font-weight:700;border-radius:7px;padding:2px 8px;white-space:nowrap}
.st.aktiv{background:var(--ok-bg);color:var(--ok)}
.st.blok{background:var(--bad-bg);color:var(--bad)}
.mini{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-size:14px;font-weight:650;margin-top:9px}
.mini.danger{color:var(--bad)}
.pct{font-family:var(--serif);font-size:26px;font-weight:700;line-height:1}
details summary{cursor:pointer;color:var(--brand);font-size:14px;margin-top:6px}
.code{font-weight:700;letter-spacing:.5px}
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:16px}
.tbl th,.tbl td{padding:10px 10px;border-bottom:1px solid var(--line);text-align:left}
.tbl tr:last-child td{border-bottom:0}
.tbl th{font-size:13px;color:var(--muted);font-weight:650;background:var(--bg)}
.tbl td.n{width:34px;color:var(--muted);font-variant-numeric:tabular-nums}
.tbl td.r{text-align:right;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl tr.miss td{background:var(--bad-bg)}
.tbl tr.miss td.r{color:var(--bad);font-weight:650}
.tbl .g{color:var(--muted);font-size:13px}
.sum{display:flex;justify-content:space-between;font-size:15px;margin:0 2px 8px;color:var(--muted)}
.sum b{color:var(--ink)}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.deco{text-align:center;margin-top:34px;color:var(--muted)}
.deco svg{display:block;margin:0 auto 6px;width:96px;height:auto}
.deco p{font-family:var(--serif);font-style:italic;font-size:15px;margin:0}
.sig{background:none;border:0;padding:6px 0 6px 6px;margin-left:-6px;font:inherit;color:inherit;cursor:default;-webkit-tap-highlight-color:transparent}
.ed-sec{margin-top:22px}
.ed-sec > h2{display:flex;justify-content:space-between;align-items:center}
.ed-row{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.ed-row .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ed-row input,.ed-row select,.ed-row textarea,.ed-home input{width:100%;padding:10px 11px;border-radius:10px;border:2px solid var(--line);background:var(--bg);font-size:16px}
.ed-row textarea{resize:vertical;min-height:58px;font-family:inherit}
.ed-row label,.ed-home label{display:block;font-size:13px;color:var(--muted);margin:6px 0 3px;font-weight:600}
.ed-row .foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.ed-home{background:var(--surface);border:2px dashed var(--brand);border-radius:18px;padding:14px}
.ed-home .big{font-family:var(--serif);font-size:24px;font-weight:700}
.savebar{position:sticky;bottom:0;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);margin-top:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:15px;z-index:30;max-width:90vw}
.toast[hidden]{display:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <section class="screen" id="s-topics" hidden>
    <div class="topbar"><a class="mini" href="../" style="margin:0;text-decoration:none">← My New Vocabulary</a></div>
    <div class="hero" role="img" aria-label="English Grammar">
      <div class="hero-txt"><span class="chip">English</span><div class="hero-t">Grammar</div><div class="hero-s" id="hero-s"></div></div>
      <div class="hero-card" aria-hidden="true"><b>a / an</b><i>an book</i><i class="ok">a book</i><i>the a book</i></div>
    </div>
    <div class="topbar"><span class="muted">Mövzunu seç</span><button class="mini" id="go-mist" type="button" style="margin:0">❗ Səhvlərim</button></div>
    <div class="tiles" id="topics"></div>
  </section>

  <section class="screen" id="s-blocks" hidden>
    <div class="topbar"><button class="mini" data-go="topics" style="margin:0">← Mövzular</button></div>
    <h1 id="blocks-title"></h1>
    <p class="muted">Bloku seç. Mavi bloklar işlənib.</p>
    <div class="tiles" id="blocks"></div>
  </section>

  <section class="screen" id="s-test" hidden>
    <div class="topbar"><button class="mini" id="leave" style="margin:0">← Mövzular</button><button class="mini" id="finish-top" type="button" style="margin:0">İmtahanı bitir</button></div>
    <div class="nav" id="nav"></div>
    <div class="legend"><span><i style="background:var(--blue)"></i>Düz</span><span><i style="background:var(--bad)"></i>Səhv</span><span><i style="background:var(--warn)"></i>Cavabsız</span></div>
    <div class="card">
      <div class="muted small" id="num"></div>
      <div class="qtext" id="q"></div>
      <ol class="gitems" id="items" hidden></ol>
      <div class="opts" id="opts"></div>
    </div>
    <div class="pager"><button class="btn ghost" id="prev" type="button">Əvvəlki</button><button class="btn" id="next" type="button">Növbəti</button></div>
  </section>

  <section class="screen" id="s-result" hidden>
    <div class="topbar"><button class="mini" data-go="topics" style="margin:0">← Mövzular</button></div>
    <div class="rcard">
      <div class="rhead"><span id="res-type"></span><span id="res-date"></span></div>
      <div class="rscore"><span id="res-score"></span><span id="res-pct"></span></div>
      <div class="rbar"><i id="res-bar"></i></div>
      <div id="res-send" style="margin:14px 0"></div>
      <div id="res-wrong-wrap"><b>Səhv və ya cavabsız suallar</b><ul class="wrong g" id="res-wrong"></ul></div>
    </div>
    <button class="btn ghost" id="res-redo" type="button" style="margin-top:16px">Yenidən işlə</button>
    <button class="btn ghost" data-go="blocks" type="button">Bloklara qayıt</button>
  </section>

  <section class="screen" id="s-mist" hidden>
    <div class="topbar"><button class="mini" data-go="topics" style="margin:0">← Mövzular</button></div>
    <h1>Səhvlərim</h1>
    <p class="muted" id="mist-sub"></p>
    <button class="btn" id="mist-practice" type="button">Səhvləri təkrar et</button>
    <button class="btn ghost" id="mist-clear" type="button">Siyahını təmizlə</button>
  </section>

  <div class="modal" id="modal" hidden>
    <div class="card" role="dialog" aria-modal="true">
      <h2 id="m-title"></h2><p id="m-text"></p>
      <button class="btn" id="m-ok" type="button"></button>

const MV = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  st(){ const o = MV.get('myvocab-v2', null) || {}; if (!Array.isArray(o.log)) o.log = []; return o; },
  save(o){ try{ localStorage.setItem('myvocab-v2', JSON.stringify(o)); }catch(e){} },
  pr(){ const p = MV.get('myvocab-prof', null); return p && p.n && p.k && String(p.t || '').replace(/\D/g, '').length === 9 ? p : null; }
};
function mvLog(r, topic){ const o = MV.st(); if (o.log.some(e => e.at === r.ts)) return; o.log.push({ sec: 'Grammar · ' + r.title, g: 'gram|' + topic, r: r.score, n: r.total, p: Math.round(r.score / r.total * 100), w: [], at: r.ts, sent: 0 }); MV.save(o);
  /* 📊 qrupdakı şagirdin nəticəsi müəllimin cədvəlinə: növbəti dəfə ana səhifə açılanda göndərilir */
  try{ const reg = MV.get('mnv-reg2', null); if (reg && reg.tel){ const q = MV.get('mnv-q', []); q.push({ a: 'res', tel: reg.tel, list: [{ sec: 'Grammar · ' + r.title, r: r.score, n: r.total, p: Math.round(r.score / r.total * 100), w: [], at: r.ts }] }); localStorage.setItem('mnv-q', JSON.stringify(q.slice(-200))); } }catch(e){}
}
function mvSendBox(r){
  const el = document.getElementById('res-send'); if (!el) return; if (!r || r.mist){ el.innerHTML = ''; return; }
  if (MV.get('mnv-grp', '')){ el.innerHTML = '<p class="muted small" style="text-align:center;font-weight:700;color:#0E7C86">✓ Nəticən yadda saxlanılır və müəllimə avtomatik çatır</p>'; return; }
  const P = MV.pr(), o = MV.st(), cur = o.log.find(e => e.at === r.ts);
  if (!cur){ el.innerHTML = ''; return; }
  if (!P){ el.innerHTML = '<p class="muted small" style="text-align:center">Nəticəni müəllimə göndərmək üçün My New Vocabulary-nin ana səhifəsində «Nəticəni müəllimə göndər» bölməsini doldur.</p>'; return; }
  const list = o.log.filter(e => !e.sent && e.g === cur.g).slice(-20);
  if (!list.length){ el.innerHTML = '<p class="muted small" style="text-align:center">✓ Nəticə müəllimə göndərildi.</p>'; return; }
  const d = new Date(), z = n => String(n).padStart(2, '0');
  const txt = `📊 Results: ${z(d.getDate())}.${z(d.getMonth() + 1)}.${d.getFullYear()}\n\n👤 ${P.n} / ${P.k}\n\n` + list.map((e, k) => `${k + 1}) ${e.sec} - ${e.p}%`).join('\n');
  el.innerHTML = `<a class="btn wa" style="text-align:center;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/994${String(P.t).replace(/\D/g, '')}?text=${encodeURIComponent(txt)}" id="mv-send">Nəticəni müəllimə göndər${list.length > 1 ? ` (${list.length} blok birlikdə)` : ''}</a>`;
  document.getElementById('mv-send').onclick = () => { const o2 = MV.st(), A = new Set(list.map(e => e.at)), now = Date.now(); o2.log.forEach(e => { if (!e.sent && A.has(e.at)) e.sent = now; }); MV.save(o2); setTimeout(() => mvSendBox(r), 400); };
}

  $("#blocks").innerHTML = GT.blocks.filter(b => b.topic === TOPIC).map(b => {
    const d = getDone(b.id);
    return `<button class="tile ${d ? "done" : ""}" data-b="${b.id}"><span class="ic">${d ? "✓" : "📝"}</span><span><b>${esc(b.name)}</b>${b.az ? `<span class="az2">${esc(b.az)}</span>` : ""}<small>${b.tests.length} test</small>${d ? `<span class="st2 ok">${d.score}/${d.total} düz cavab</span>` : ""}</span></button>`;
  }).join("");
  show("s-blocks");
}
$("#blocks").addEventListener("click", e => { const b = e.target.closest("[data-b]"); if (!b) return; const d = getDone(b.dataset.b); if (d) showResult(d); else start(b.dataset.b); });

function start(id, isMist){
  if (Date.now() - startedAt < 1500) return; startedAt = Date.now();
  let qs;
  if (isMist) qs = shuffle(Object.keys(mist()).map(k => { const [bid, n] = k.split("#"), b = GB(bid); return b && b.tests[+n] ? { q: b.tests[+n], id: k } : null; }).filter(Boolean)).slice(0, 20);
  else qs = GB(id).tests.map((q, n) => ({ q, id: `${id}#${n}` }));
  if (!qs.length) return;
  BLOCK = id;
  G = { block: id, mist: !!isMist, qs: qs.map(x => ({ q: x.q, id: x.id, chosen: null, visited: false })), i: 0, flagged: false };
  show("s-test"); render();
}
function render(){
  const cur = G.qs[G.i]; cur.visited = true;
  $("#nav").innerHTML = G.qs.map((x, k) => {
    let c = "";
    if (x.chosen !== null) c = x.chosen === x.q.a ? "n-ok" : "n-bad";
    else if ((x.visited && k !== G.i) || G.flagged) c = "n-skip";
    if (k === G.i) c += " n-cur";
    return `<button type="button" class="${c}" data-k="${k}" aria-label="Sual ${k + 1}">${k + 1}</button>`;
  }).join("");
  $("#num").textContent = `Sual ${G.i + 1} / ${G.qs.length}`;
  $("#q").innerHTML = fmtQ(cur.q.q);
  $("#items").hidden = !cur.q.i;
  $("#items").innerHTML = (cur.q.i || []).map((x, k) => `<li><b>${k + 1}.</b>${fmtQ(x)}</li>`).join("");
  $("#opts").innerHTML = cur.q.o.map((o, k) => {
    let c = "";
    if (cur.chosen !== null){ if (k === cur.q.a) c = "is-ok"; else if (k === cur.chosen) c = "is-bad"; }
    return `<button class="opt ${c}" type="button" data-k="${k}" ${cur.chosen !== null ? "disabled" : ""}><span class="k">${"ABCDE"[k]}</span><span>${fmtQ(o)}</span></button>`;
  }).join("");
  $("#prev").disabled = G.i === 0;
  $("#next").textContent = G.i === G.qs.length - 1 ? "İmtahanı bitir" : "Növbəti";
}
$("#nav").addEventListener("click", e => { const b = e.target.closest("button"); if (b){ G.i = +b.dataset.k; render(); } });
$("#opts").addEventListener("click", e => {
  const b = e.target.closest(".opt"); if (!b) return;
  const cur = G.qs[G.i]; if (cur.chosen !== null) return;
  cur.chosen = +b.dataset.k;
  if (cur.chosen !== cur.q.a) setMist(cur.id, true); else if (G.mist) setMist(cur.id, false);
  render();
});
$("#prev").addEventListener("click", () => { if (G.i > 0){ G.i--; render(); } });
$("#next").addEventListener("click", () => { if (G.i < G.qs.length - 1){ G.i++; render(); } else finish(); });
$("#finish-top").addEventListener("click", () => finish());
$("#leave").addEventListener("click", async () => { if (await confirmBox("Mövzulara qayıt", "Test yarımçıq qalacaq və nəticə yadda saxlanmayacaq.", "Mövzulara qayıt", "Testə davam et")) showTopics(); });
async function finish(){
  const empty = G.qs.map((x, k) => x.chosen === null ? k + 1 : 0).filter(Boolean);
  if (empty.length){
    G.flagged = true; render();
    if (await confirmBox(`${empty.length} sual cavabsızdır`, `Cavab vermədiyin suallar: ${empty.join(", ")}. Onlar narıncı rəngdədir. Yenə də bitirmək istəyirsən?`, "Qayıt və cavabla", "Yenə də bitir")){ G.i = empty[0] - 1; render(); return; }
  }
  const wrong = G.qs.filter(x => x.chosen !== x.q.a);
  const blk = G.mist ? null : GB(G.block), tp = blk ? GT.topics.find(x => x.id === blk.topic) : null;
  const r = { block: G.block, mist: G.mist, title: G.mist ? "Səhvlərim" : `${tp.name}: ${blk.name}`, ts: Date.now(), score: G.qs.length - wrong.length, total: G.qs.length,
    wrong: wrong.map(x => [plainQ(x.q.q) + (x.q.i ? " (" + x.q.i.map((s, k) => (k + 1) + ". " + plainQ(s)).join(", ") + ")" : ""), "Düz cavab: " + "ABCDE"[x.q.a] + ") " + plainQ(x.q.o[x.q.a]) + (x.chosen === null ? " · cavabsız" : "")]) };
  if (!r.mist){ putDone(r); mvLog(r, blk.topic); }
  showResult(r);
}
function showResult(r){
  R = r;
  $("#res-type").textContent = r.title; $("#res-date").textContent = fmtDate(r.ts);
  const pct = Math.round(r.score / r.total * 100);
  $("#res-score").innerHTML = `${r.score}<small> / ${r.total}</small>`; $("#res-pct").textContent = pct + "%"; $("#res-bar").style.width = pct + "%";
  $("#res-wrong-wrap").hidden = !r.wrong.length;
  $("#res-wrong").innerHTML = r.wrong.map(([a, b]) => `<li><span>${esc(a)}</span><span>${esc(b)}</span></li>`).join("");
  mvSendBox(r);
  show("s-result");
}
$("#res-redo").addEventListener("click", () => { if (R.mist) return Object.keys(mist()).length ? start("", true) : openMist(); start(R.block); });
function openMist(){
  const n = Object.keys(mist()).length;
  $("#mist-sub").textContent = n ? `${n} sual təkrar gözləyir. Düz cavab verdiyin suallar siyahıdan silinir.` : "Hələ səhv yoxdur. Testlərdə səhv etdiyin suallar burada toplanacaq.";
  $("#mist-practice").hidden = !n; $("#mist-clear").hidden = !n;
  show("s-mist");
}
$("#go-mist").addEventListener("click", openMist);
/* My New Vocabulary → Səhvlərim → "Grammar səhvlərini işlə" */
if (location.hash === "#mist"){ history.replaceState(null, "", location.pathname); setTimeout(() => { Object.keys(mist()).length ? start("", true) : openMist(); }, 0); }
$("#mist-practice").addEventListener("click", () => start("", true));
$("#mist-clear").addEventListener("click", async () => { if (await confirmBox("Siyahını təmizlə", "Bütün səhvlər silinəcək.", "Təmizlə", "Ləğv et")){ store.set("gr_mist", {}); openMist(); } });
document.addEventListener("click", e => {
  const b = e.target.closest("[data-go]"); if (!b) return;
  if (b.dataset.go === "topics") showTopics();
  else if (b.dataset.go === "blocks"){ if (R && R.block){ const bl = GB(R.block); if (bl) TOPIC = bl.topic; } TOPIC ? showBlocks() : showTopics(); }
});
showTopics();
</script>
</body>
